x-app-env: &app-env
  PG_DSN: postgresql://bank:${POSTGRES_PASSWORD:-bank}@postgres:5432/bank
  CORE_API_URL: http://core-api:8001
  LANDING_DIR: /opt/project/landing

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      POSTGRES_DB: bank
      ANALYST_RO_PASSWORD: ${ANALYST_RO_PASSWORD:-analyst_ro}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bank"]
      interval: 5s
      retries: 20

  core-api:
    build: sources/core_api
    environment:
      CORE_API_FAIL_RATE: ${CORE_API_FAIL_RATE:-0.05}
      CORE_API_DUP_RATE: ${CORE_API_DUP_RATE:-0.01}
    volumes: ["./data/raw:/data/raw:ro"]
    ports: ["8001:8001"]

  airflow:
    build: {context: ., dockerfile: airflow/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *app-env
      DBT_HOST: postgres
      DBT_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://bank:${POSTGRES_PASSWORD:-bank}@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/project/airflow/logs
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes: ["./:/opt/project"]
    ports: ["8080:8080"]
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password $$AIRFLOW_ADMIN_PASSWORD --firstname Admin
      --lastname User --role Admin --email admin@example.com || true) &&
      (airflow scheduler &) && exec airflow webserver"

  dq-api:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    environment:
      RO_DSN: postgresql://analyst_ro:${ANALYST_RO_PASSWORD:-analyst_ro}@postgres:5432/bank
    command: uvicorn dq.api:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
    depends_on: [postgres]

  assistant-api:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    environment:
      RO_DSN: postgresql://analyst_ro:${ANALYST_RO_PASSWORD:-analyst_ro}@postgres:5432/bank
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_KEY_2: ${GOOGLE_API_KEY_2:-}
      GOOGLE_API_KEY_3: ${GOOGLE_API_KEY_3:-}
    command: uvicorn assistant.api:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]
    depends_on: [postgres]

  assistant-ui:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    environment:
      ASSISTANT_API: http://assistant-api:8003
    command: streamlit run assistant/ui.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [assistant-api]

volumes:
  pgdata:
